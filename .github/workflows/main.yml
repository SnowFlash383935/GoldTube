name: Deploy to Vercel Branch

on:
  push:
    branches: [main] # или другая ветка, с которой хотите запускать деплой
  workflow_dispatch: # позволяет запускать вручную

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Install Expo CLI and dependencies
      run: |
        npm install
        
    - name: Export Expo app for web
      run: npx expo export --platform web
      
    - name: Create vercel branch and push dist folder
      run: |
        # Настройка git
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        
        # Создаем новую ветку vercel
        git checkout -b vercel
        
        # Создаем временную директорию и копируем туда dist
        mkdir -p ../temp_dist
        cp -r dist/* ../temp_dist/
        
        # Удаляем все файлы в текущей директории кроме .git
        find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
        
        # Копируем содержимое dist в корень
        cp -r ../temp_dist/* .
        
        # Удаляем временную директорию
        rm -rf ../temp_dist
        
        # Добавляем все файлы и коммитим
        git add .
        git commit -m "Deploy to Vercel: ${{ github.sha }}"
        
        # Пушим в ветку vercel (с флагом force для перезаписи)
        git push -f origin vercel
